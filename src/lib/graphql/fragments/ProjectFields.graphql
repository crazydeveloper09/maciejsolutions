fragment ProjectFields on Project {
  id
  title
  shortDescription
  types
  description
  slug
  profilePicture {
    url
  }
  gallery {
    url
  }
  projectStatus
  webLink
  androidLink
  iosLink
  added
  edited
  categories {
    ...CategoryFields
  }
  stack {
    ...TechnologyFields
  }
}
